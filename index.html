<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IT Project Hub Tutorial</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap');
:root{
  --navy-900:#0a1f3d;--navy-800:#0f2a4f;--navy-700:#173d6b;--blue-500:#2f6fb0;--blue-400:#4c8ac9;
  --gold-500:#b8912f;--gold-300:#d9b869;--paper:#f5f6f8;--surface:#ffffff;--surface-2:#eef1f5;
  --ink:#14213d;--ink-soft:#4a5878;--line:#d7dce6;--good:#1e7a4c;--bad:#a4302b;--warn:#b7791f;
  --focus:#2f6fb0;--teal-500:#177d74;--plum-500:#7d3f68;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy-900:#0a1424;--navy-800:#0d1a30;--navy-700:#15294a;--blue-500:#6fa8dc;--blue-400:#8fbbe6;
    --gold-500:#e0c15c;--gold-300:#f0da8f;--paper:#0b1220;--surface:#111a2c;--surface-2:#16223a;
    --ink:#e7ecf5;--ink-soft:#a9b4cc;--line:#243250;--good:#5fbf8b;--bad:#e2837e;--warn:#e0b25c;
    --focus:#8fbbe6;--teal-500:#4fb3a9;--plum-500:#c87fb0;
  }
}
:root[data-theme="dark"]{
  --navy-900:#0a1424;--navy-800:#0d1a30;--navy-700:#15294a;--blue-500:#6fa8dc;--blue-400:#8fbbe6;
  --gold-500:#e0c15c;--gold-300:#f0da8f;--paper:#0b1220;--surface:#111a2c;--surface-2:#16223a;
  --ink:#e7ecf5;--ink-soft:#a9b4cc;--line:#243250;--good:#5fbf8b;--bad:#e2837e;--warn:#e0b25c;
  --focus:#8fbbe6;--teal-500:#4fb3a9;--plum-500:#c87fb0;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Source Sans 3',system-ui,sans-serif;line-height:1.55;}
h1,h2,h3,h4{font-family:'Fraunces',Georgia,serif;color:var(--ink);text-wrap:balance;margin:0;}
a{color:var(--blue-500);}
button{font-family:inherit;}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
.app{display:flex;min-height:100vh;}

.rail{width:250px;flex:0 0 250px;background:var(--navy-900);color:#e7ecf5;padding:24px 18px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;}
.brand{display:flex;align-items:center;gap:10px;appearance:none;background:none;border:none;padding:6px;margin:-6px;border-radius:10px;cursor:pointer;text-align:left;width:calc(100% + 12px);}
.brand:hover{background:rgba(255,255,255,.06);}
.brand .mark{width:40px;height:auto;border-radius:6px;flex:0 0 40px;display:block;}
.brand .txt{display:flex;flex-direction:column;gap:1px;min-width:0;}
.brand .eyebrow{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-300);}
.brand h1{font-size:16.5px;color:#fff;line-height:1.25;}
.progress-wrap{display:flex;flex-direction:column;gap:6px;}
.progress-label{display:flex;justify-content:space-between;font-size:12px;color:#a9b8d6;}
.progress-track{height:6px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold-500),var(--gold-300));border-radius:4px;transition:width .4s ease;}
.steps{display:flex;flex-direction:column;gap:4px;flex:1;}
.step{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;width:100%;color:#8f9dc0;cursor:default;border:1px solid transparent;position:relative;appearance:none;background:none;font:inherit;text-align:left;}
.step.clickable{cursor:pointer;}
.step.clickable:hover{background:rgba(255,255,255,.07);}
.step:not(:last-child)::after{content:"";position:absolute;left:23px;top:38px;width:1px;height:calc(100% - 6px);background:rgba(255,255,255,.12);}
.step .num{width:26px;height:26px;border-radius:50%;flex:0 0 26px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:rgba(255,255,255,.08);color:#9fb0d4;border:1px solid rgba(255,255,255,.14);z-index:1;}
.step.done .num{background:#1e7a4c;color:#fff;border-color:#1e7a4c;}
.step.done .num::before{content:"✓";}
.step.current .num{background:var(--gold-500);color:#241a05;border-color:var(--gold-500);}
.step.current{background:rgba(255,255,255,.06);}
.step.locked{opacity:.4;}
.step .label{min-width:0;}
.step .label b{display:block;font-weight:600;font-size:13.5px;color:#e4e9f5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.step.locked .label b{color:#8f9dc0;}
.step .label span{font-size:11px;color:#7f8fb4;}
.rail-foot{font-size:11px;color:#7c8bb0;border-top:1px solid rgba(255,255,255,.12);padding-top:12px;}

.main{flex:1;min-width:0;display:flex;justify-content:center;padding:40px 24px 80px;}
.sheet{width:100%;max-width:780px;display:flex;flex-direction:column;gap:28px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:32px 34px;box-shadow:0 1px 2px rgba(10,20,40,.04);}
.intro-logo{height:52px;width:auto;border-radius:6px;margin-bottom:18px;}
.module-head{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
.module-icon{width:44px;height:44px;border-radius:11px;flex:0 0 44px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb, var(--accent, var(--blue-500)) 16%, var(--surface));color:var(--accent, var(--blue-500));}
.module-icon svg{width:22px;height:22px;}
.kicker{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent, var(--blue-500));font-weight:700;margin-bottom:3px;}
.card h2{font-size:25px;margin-bottom:4px;}
.card h3{font-family:'Source Sans 3',system-ui,sans-serif;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--accent, var(--navy-700));margin:0;}
.lede{color:var(--ink-soft);font-size:15px;margin-top:6px;}
.section{border:1px solid var(--line);border-radius:12px;padding:18px 20px 20px;margin-top:16px;border-left:3px solid var(--accent, var(--blue-500));background:var(--surface);}
.section p{color:var(--ink-soft);font-size:14.5px;margin:8px 0 0;}
.section p:first-of-type{margin-top:10px;}
.section b{color:var(--ink);}
ul.plain,ol.plain{margin:10px 0 0;padding-left:20px;}
ul.plain li,ol.plain li{margin-bottom:6px;color:var(--ink-soft);font-size:14.5px;}
ul.check{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;}
ul.check li{padding-left:24px;position:relative;color:var(--ink-soft);font-size:14.5px;}
ul.check li::before{content:"✓";position:absolute;left:0;color:var(--good);font-weight:700;}
.callout{background:var(--surface-2);border-left:3px solid var(--gold-500);border-radius:8px;padding:12px 16px;margin-top:14px;font-size:13.5px;color:var(--ink-soft);}
.callout b{color:var(--ink);}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.compare div{border-radius:10px;padding:12px 14px;font-size:13.5px;color:var(--ink-soft);border:1px solid var(--line);}
.compare .do{border-color:var(--good);background:color-mix(in srgb, var(--good) 8%, var(--surface));}
.compare .dont{border-color:var(--bad);background:color-mix(in srgb, var(--bad) 7%, var(--surface));}
.compare b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px;}
.compare .do b{color:var(--good);} .compare .dont b{color:var(--bad);}
@media (max-width:560px){.compare{grid-template-columns:1fr;}}

/* mock screens */
.mock{margin-top:14px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);font-size:13px;}
.mock .bar{display:flex;align-items:center;gap:6px;padding:7px 10px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:11px;color:var(--ink-soft);}
.mock .bar i{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block;}
.mock .bar span{margin-left:8px;}
.mock .body{padding:14px 16px;}
.mock .cap{font-size:11.5px;color:var(--ink-soft);padding:8px 16px;border-top:1px dashed var(--line);background:var(--surface-2);}
.mock .ptitle{font-family:'Fraunces',serif;font-size:18px;color:var(--ink);}
.mock .meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0 10px;color:var(--ink-soft);font-size:12px;}
.mock .btns{display:flex;flex-wrap:wrap;gap:6px;}
.mock .btns span{background:var(--navy-800);color:#fff;border-radius:6px;padding:5px 9px;font-size:11.5px;}
.mock .btns span.alt{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);}
.pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:11px;font-weight:700;color:#fff;}
.pill.g{background:#1e7a4c;} .pill.y{background:#b7791f;} .pill.r{background:#a4302b;}
.mock table{width:100%;border-collapse:collapse;font-size:12.5px;}
.mock th{text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);border-bottom:1px solid var(--line);padding:5px 6px;}
.mock td{border-bottom:1px solid var(--line);padding:6px;color:var(--ink);}
.mock .grp{font-weight:700;color:var(--navy-700);font-size:12px;margin:10px 0 4px;}
:root[data-theme="dark"] .mock .grp{color:var(--blue-400);}
.mock .fld{margin-bottom:9px;}
.mock .fld label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft);margin-bottom:3px;}
.mock .fld .in{border:1px solid var(--line);border-radius:6px;padding:6px 9px;background:var(--surface);color:var(--ink);min-height:30px;}
.mock .fld .in.ta{min-height:44px;}
.mock .radios{display:flex;gap:8px;flex-wrap:wrap;}
.mock .radios span{border:1px solid var(--line);border-radius:6px;padding:4px 9px;}
.mock .radios span.on{border-color:#1e7a4c;background:color-mix(in srgb,#1e7a4c 12%,var(--surface));font-weight:600;}
.tl{display:flex;justify-content:space-between;gap:8px;position:relative;margin-top:16px;}
.tl::before{content:"";position:absolute;left:12%;right:12%;top:20px;height:3px;background:linear-gradient(90deg,var(--blue-500),var(--navy-700));border-radius:2px;}
.tl .ev{flex:1;text-align:center;position:relative;}
.tl .dot{width:42px;height:42px;border-radius:50%;margin:0 auto;background:var(--blue-500);border:3px solid var(--surface);display:flex;align-items:center;justify-content:center;color:#fff;}
.tl .ev.n .dot{background:var(--navy-700);}
.tl .dot svg{width:19px;height:19px;}
.tl .when{font-size:10.5px;letter-spacing:.1em;font-weight:700;color:var(--blue-500);margin-top:6px;}
.tl .what{font-weight:700;font-size:13.5px;color:var(--ink);}
.tl .desc{font-size:12px;color:var(--ink-soft);line-height:1.35;margin-top:2px;}
@media (max-width:560px){.tl{flex-direction:column;}.tl::before{display:none;}}

.crumbbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;margin:-40px -24px 0;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
.crumbbar .homebtn{display:flex;align-items:center;gap:6px;appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;font-size:13.5px;font-weight:600;cursor:pointer;}
.crumbbar .homebtn:hover{background:var(--surface-2);}
.crumbbar .homebtn svg{width:16px;height:16px;}
.crumbbar .crumb{font-size:13px;color:var(--ink-soft);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.crumbbar .crumb b{color:var(--ink);font-weight:600;}
.crumbbar select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 8px;font:inherit;font-size:13px;max-width:200px;}
.mainwrap{flex:1;min-width:0;display:flex;flex-direction:column;}
@media (max-width:760px){.crumbbar{margin:-20px -16px 0;}}
@media (max-width:560px){.crumbbar .crumb{display:none;}.crumbbar select{flex:1;max-width:none;}}
.section-picker{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
@media (max-width:560px){.section-picker{grid-template-columns:1fr;}}
.pick{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);border-radius:12px;padding:14px 15px;background:var(--surface);appearance:none;font:inherit;color:var(--ink);cursor:pointer;}
.pick:hover{border-color:var(--pick-accent, var(--blue-500));background:var(--surface-2);}
.pick:disabled{cursor:not-allowed;opacity:.55;}
.pick .picon{width:38px;height:38px;border-radius:10px;flex:0 0 38px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb, var(--pick-accent, var(--blue-500)) 16%, var(--surface));color:var(--pick-accent, var(--blue-500));}
.pick .picon svg{width:19px;height:19px;}
.pick .ptxt{min-width:0;}
.pick .ptxt b{display:block;font-size:14px;}
.pick .ptxt span{font-size:12px;color:var(--ink-soft);}
.pick .plock{margin-left:auto;font-size:11px;color:var(--ink-soft);flex:0 0 auto;}

.nav-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.btn{appearance:none;border:1px solid var(--navy-700);background:var(--navy-900);color:#fff;padding:11px 22px;border-radius:8px;font-size:14.5px;font-weight:600;cursor:pointer;}
.btn:hover{background:var(--navy-700);}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);}
.btn.ghost:hover{background:var(--surface-2);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn.gold{background:var(--gold-500);border-color:var(--gold-500);color:#241a05;}
.btn.gold:hover{background:var(--gold-300);}

.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.qcount{font-size:13px;color:var(--ink-soft);}
.question{padding:20px 0;border-top:1px solid var(--line);}
.question:first-of-type{border-top:none;padding-top:8px;}
.qtext{font-weight:700;margin-bottom:12px;font-size:15.5px;display:flex;gap:10px;}
.qtext .qn{color:var(--accent, var(--blue-500));font-family:'Fraunces',serif;font-size:16px;}
.opts{display:flex;flex-direction:column;gap:8px;}
.opt{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:10px;cursor:pointer;border:1px solid var(--line);font-size:14.5px;background:var(--surface);position:relative;}
.opt:hover{background:var(--surface-2);border-color:var(--accent, var(--blue-500));}
.opt input{position:absolute;opacity:0;pointer-events:none;}
.opt .letter{width:24px;height:24px;border-radius:7px;flex:0 0 24px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line);}
.opt.selected{border-color:var(--accent, var(--blue-500));background:color-mix(in srgb, var(--accent, var(--blue-500)) 8%, var(--surface));}
.opt.selected .letter{background:var(--accent, var(--blue-500));color:#fff;border-color:var(--accent, var(--blue-500));}
.opt.correct{background:rgba(30,122,76,.12);border-color:var(--good);}
.opt.correct .letter{background:var(--good);color:#fff;border-color:var(--good);}
.opt.incorrect{background:rgba(164,48,43,.12);border-color:var(--bad);}
.opt.incorrect .letter{background:var(--bad);color:#fff;border-color:var(--bad);}
.opt.disabled{cursor:default;}
.fb{font-size:13px;margin-top:8px;font-weight:600;}
.fb.good{color:var(--good);} .fb.bad{color:var(--bad);}
.result-banner{border-radius:10px;padding:16px 18px;display:flex;gap:12px;align-items:flex-start;font-size:14.5px;margin-top:6px;}
.result-banner.pass{background:rgba(30,122,76,.12);border:1px solid var(--good);}
.result-banner.fail{background:rgba(164,48,43,.12);border:1px solid var(--bad);}
.result-banner .badge{font-size:20px;line-height:1;}
.done-hero{text-align:center;padding:10px 0 4px;}
.done-hero .big{width:64px;height:64px;border-radius:50%;background:var(--good);color:#fff;font-size:32px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;}

@media (max-width:760px){
  .app{flex-direction:column;}
  .rail{width:100%;flex:none;position:relative;height:auto;flex-direction:row;align-items:center;flex-wrap:wrap;gap:14px;padding:16px;}
  .steps{display:none;} .progress-wrap{flex:1;min-width:140px;} .rail-foot{display:none;}
  .main{padding:20px 16px 56px;} .card{padding:22px 18px;}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
